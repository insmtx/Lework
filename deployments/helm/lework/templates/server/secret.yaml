{{- $fullname := include "lework.fullname" . -}}
# 此 Secret 提供 server 配置文件中 ${VAR} 占位符所需的环境变量。
# worker 用的 LLM_API_KEY 见 {{ include "lework.workerSecretName" . }}。
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lework.serverSecretName" . }}
  labels:
    {{- include "lework.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
stringData:
  LEWORK_JWT_SECRET: {{ .Values.server.jwtSecret | quote }}
  LEWORK_DATABASE_URL: {{ include "lework.databaseURL" . | quote }}
  LEWORK_NATS_URL: {{ include "lework.natsURL" . | quote }}
  LEWORK_STORAGE_SIGN_SECRET: {{ .Values.storage.signSecret | quote }}
  LEWORK_BASE_URL: {{ include "lework.serverBaseUrl" . | quote }}
