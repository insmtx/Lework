{{- if .Values.postgresql.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "leros.fullname" . }}-postgresql
  labels:
    {{- include "leros.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: 5432
  selector:
    {{- include "leros.selectorLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "leros.fullname" . }}-postgresql-init
  labels:
    {{- include "leros.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
data:
  init.sql: |
    -- Database initialization for Leros
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "leros.fullname" . }}-postgresql
  labels:
    {{- include "leros.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "leros.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "leros.selectorLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "leros.selectorLabels" (dict "root" . "component" "postgresql") | nindent 8 }}
    spec:
      {{- with (include "leros.imagePullSecrets" . | trim) }}
      {{ . | nindent 6 }}
      {{- end }}
      {{- with .Values.postgresql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.server.imagePullPolicy | default "IfNotPresent" }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.password | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data
          ports:
            - name: tcp-postgresql
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          {{- with .Values.postgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.postgresql.username }} -d {{ .Values.postgresql.database }}"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.postgresql.username }} -d {{ .Values.postgresql.database }}"]
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: initdb
          configMap:
            name: {{ include "leros.fullname" . }}-postgresql-init
        - name: data
          hostPath:
            path: {{ include "leros.hostPath" (dict "root" . "path" .Values.postgresql.hostPath) | quote }}
            type: DirectoryOrCreate
{{- end -}}
