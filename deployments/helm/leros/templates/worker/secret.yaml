{{/*
  Worker Secret：被 server 的 k8s scheduler 通过 secretKeyRef 注入到 worker Pod
  环境变量 LLM_API_KEY（data key 固定为 LLM_API_KEY）。
  server 同时引用此 Secret 获取 LLM_API_KEY 以填充 llm.api_key 占位符。
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "leros.workerSecretName" . }}
  labels:
    {{- include "leros.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
type: Opaque
stringData:
  LLM_API_KEY: {{ .Values.llm.apiKey | default "" | quote }}
