{{- $fullname := include "leros.fullname" . -}}
# 此 Secret 提供 server 配置文件中 ${VAR} 占位符所需的环境变量。
# worker 用的 LLM_API_KEY 见 {{ include "leros.workerSecretName" . }}。
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "leros.serverSecretName" . }}
  labels:
    {{- include "leros.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
stringData:
  LEROS_JWT_SECRET: {{ .Values.server.jwtSecret | quote }}
  LEROS_DATABASE_URL: {{ include "leros.databaseURL" . | quote }}
  LEROS_NATS_URL: {{ include "leros.natsURL" . | quote }}
  LEROS_STORAGE_SIGN_SECRET: {{ .Values.storage.signSecret | quote }}
  LEROS_BASE_URL: {{ include "leros.serverBaseUrl" . | quote }}
