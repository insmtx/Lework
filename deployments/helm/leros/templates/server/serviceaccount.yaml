{{- if .Values.server.rbac.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "leros.fullname" . }}
  labels:
    {{- include "leros.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
---
# server 通过 k8s scheduler 在本 namespace 内创建/管理 worker Deployment。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "leros.fullname" . }}-worker-manager
  labels:
    {{- include "leros.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "leros.fullname" . }}-worker-manager
  labels:
    {{- include "leros.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
subjects:
  - kind: ServiceAccount
    name: {{ include "leros.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "leros.fullname" . }}-worker-manager
  apiGroup: rbac.authorization.k8s.io
{{- end -}}
