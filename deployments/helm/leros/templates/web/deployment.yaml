{{- if .Values.web.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leros.fullname" . }}-web
  labels:
    {{- include "leros.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "leros.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "leros.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      {{- with (include "leros.imagePullSecrets" . | trim) }}
      {{ . | nindent 6 }}
      {{- end }}
      terminationGracePeriodSeconds: 20
      containers:
        - name: web
          image: {{ .Values.web.image | quote }}
          imagePullPolicy: {{ .Values.web.imagePullPolicy }}
          env:
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: PORT
              value: {{ .Values.web.service.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: LEROS_API_BASE_URL
              value: {{ .Values.web.apiBaseUrl | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.web.service.port }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "leros.fullname" . }}-web
  labels:
    {{- include "leros.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
  selector:
    {{- include "leros.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
{{- end -}}
