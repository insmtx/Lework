name: leros-aio

# 一体机部署：单机跑齐 PostgreSQL、NATS、Server（内含 Worker 进程）、Web、网关。
# 数据默认落在 ./data，升级不丢；镜像可通过 .env 指定为离线导入的本地镜像。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: ${LEROS_POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_DB: ${LEROS_DB_NAME}
      POSTGRES_USER: ${LEROS_DB_USER}
      POSTGRES_PASSWORD: ${LEROS_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *default-logging
    networks: [leros]

  nats:
    image: ${LEROS_NATS_IMAGE:-nats:2.12}
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - nats_data:/data
    # nats 官方镜像不一定带 wget/curl；用二进制自身做进程级健康检查，避免误判。
    healthcheck:
      test: ["CMD", "/nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [leros]

  leros:
    # 一体机使用 worker 镜像跑 server：server 的 process scheduler 会在同一容器内
    # 拉起 /leros worker，从而复用镜像里的文档/浏览器/CLI 工具链。
    image: ${LEROS_IMAGE:-leros-aio/worker:local}
    build:
      context: ../..
      dockerfile: deployments/build/Dockerfile.worker
      args:
        GO_BUILDER_IMAGE: ${LEROS_GO_BUILDER_IMAGE:-registry.yygu.cn/library/golang:1.25}
        WORKER_BASE_IMAGE: ${LEROS_WORKER_BASE_IMAGE:-registry.yygu.cn/insmtx/leros-worker-base:saas}
    command: ["server", "--config", "/app/config/server.config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      LEROS_ENV: production
      LEROS_ADMIN_EMAIL: ${LEROS_ADMIN_EMAIL}
      LEROS_ADMIN_PASSWORD: ${LEROS_ADMIN_PASSWORD}
      LEROS_WORKSPACE_ROOT: /data/workspace
      LEROS_PUBLIC_URL: ${LEROS_PUBLIC_BASE_URL}
      LEROS_CORS_ALLOWED_ORIGINS: ${LEROS_CORS_ALLOWED_ORIGINS:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./config:/app/config:ro
      - ./data/app/storage:/data/storage
      - ./data/app/workspace:/data/workspace
      - ./data/app/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks: [leros]

  web:
    image: ${LEROS_WEB_IMAGE:-leros-aio/web:local}
    build:
      context: ../..
      dockerfile: deployments/build/Dockerfile.web
      args:
        NEXT_PUBLIC_LEROS_API_BASE_URL: /v1
    environment:
      LEROS_API_BASE_URL: http://leros:8080/v1
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      leros:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    networks: [leros]

  gateway:
    image: ${LEROS_NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${LEROS_BIND_ADDR:-0.0.0.0}:${LEROS_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      leros:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [leros]

volumes:
  postgres_data:
  nats_data:

networks:
  leros:
    driver: bridge
