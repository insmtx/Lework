# Leros k3s Server Configuration Example
#
# Create the server ConfigMap from this file, then let GitLab CI update only
# scheduler.worker_image during releases.

env: test
workspace_root:

server:
  port: 8080
  jwt:
    secret: "${LEROS_JWT_SECRET}"

database:
  url: "${LEROS_DATABASE_URL}"
  debug: false

nats:
  url: "${LEROS_NATS_URL}"

log:
  level: info

scheduler:
  mode: k8s
  kubernetes_connection: in_cluster
  kubeconfig_context: default
  namespace: leros-test

  # Workers connect to the existing Leros Server Service inside k3s.
  server_addr: leros:8080

  worker_image: leros-worker:latest
  workspace_init_image: busybox:1.36.1
  config_map: leros-worker-config
  secret: leros-secret
  image_pull_secret: leros-registry
  workspace_host_path_root: /data/workspace
  workspace_mount_root: /workspace
  storage_host_path: /data/leros-storage
  storage_mount_path: /leros-storage
  node_selector:
    node-role: worker
    kubernetes.io/hostname: t30
  worker_resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 1, memory: 1Gi }
  env:
    LEROS_STORAGE_LOCAL_DIR: /leros-storage

llm:
  provider: "openai"
  api_key: "${LLM_API_KEY}"
  model: "qwen3.6-plus"
  base_url: "https://api.example.com/v3/llm.chat/"
  # 以下均为可选参数，缺省即走模型/服务默认值；base_url 填根地址即可（带不带 /v1 均可），启动时 seed 会自动规范化 /v1 前缀。
  vision: false              # 默认模型是否支持图片（多模态）输入，seed 时写入模型配置
  top_p: 0.95                # 核采样（0-1）
  frequency_penalty: 0.1     # 频率惩罚（-2 ~ 2）
  presence_penalty: 0        # 存在惩罚（-2 ~ 2）
  limit:
    context: 82144           # 上下文窗口大小（token）
    output: 42768            # 单次输出上限（token）
  translation:
    provider: "deepseek"
    api_key: "${LLM_API_KEY}"
    model: "deepseek-v4-flash"
    base_url: "https://api.example.com/v3/llm.chat/"

storage:
  driver: local
  local_dir: /leros-storage
  bucket: leros-k3s-bucket
  sign_secret: "${LEROS_STORAGE_SIGN_SECRET}"
  base_url: "${LEROS_BASE_URL}"

client_update:
  desktop:
    min_supported_version: "0.1.16"
    latest_version: "0.1.21"
    update_url: "https://xxx.cos.ap-beijing.myqcloud.com/application/stable"
    force_message: "当前客户端版本过低，请更新后继续使用"

# Enterprise authentication adapter (only required with -tags enterprise)
# auth:
#   base_url: "${IAM_BASE_URL}"        # IAM 服务地址
#   domain_name: "${IAM_DOMAIN_NAME}"  # 域名，用于登录配置查询
