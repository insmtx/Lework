services:
  postgresql:
    image: registry.yygu.cn/library/postgres:17.9
    container_name: lework-dev-postgresql
    environment:
      POSTGRES_DB: lework_dev_db
      POSTGRES_USER: lework_dev_user
      POSTGRES_PASSWORD: lework_dev_password
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
      - ../env/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lework_dev_user", "-d", "lework_dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lework-dev-network

  nats:
    image: registry.yygu.cn/library/nats:2.12.7
    container_name: lework-dev-nats
    command: ["--config", "/etc/nats/nats-server.conf", "--jetstream"]
    ports:
      - "14223:4222"
      - "8223:8222"
    volumes:
      - dev_nats_data:/data
    configs:
      - source: nats_settings
        target: /etc/nats/nats-server.conf
    healthcheck:
      test: ["CMD", "/nats-server", "--help"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - lework-dev-network

volumes:
  dev_postgres_data:
  dev_nats_data:

configs:
  nats_settings:
    content: |
      max_payload: 8388608

networks:
  lework-dev-network:
    driver: bridge
