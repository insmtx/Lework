appId: com.leros.desktop
productName: Lework
icon: resources/icon.png
protocols:
  - name: Lework
    schemes:
      - leros
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - resources/**/*
  - package.json
  - "!**/.vscode/**"
  - "!electron.vite.config.*"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asar: true
compression: maximum
# 中文注释：协议 PDF 需要复制到安装目录的 resources 根目录，匹配主进程中的 process.resourcesPath 访问逻辑。
extraResources:
  - from: resources/terms-of-service.pdf
    to: terms-of-service.pdf
  - from: resources/privacy-policy.pdf
    to: privacy-policy.pdf
asarUnpack:
  - resources/**
mac:
  icon: resources/icon-mac.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
  target:
    - target: dmg
    - target: zip
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
win:
  icon: resources/icon.ico
  # 中文注释：Windows 安装后的快捷方式、任务栏和 EXE 图标依赖资源编辑写入，不能显式关闭。
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 中文注释：保留默认「正在运行」确认框；确认后按映像名 /F /T 结束进程，避免路径误判落入手动关闭兜底。
  include: nsis/installer.nsh
linux:
  icon: resources/linux-icons
  executableName: leros-desktop
  # 中文注释：让 .desktop 文件名、Electron app_id 与 StartupWMClass 保持一致，Linux 任务栏才能关联应用图标。
  syncDesktopName: true
  maintainer: "support@insmtx.com"
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
publish:
  provider: generic
  url: https://leros-1395325824.cos.ap-beijing.myqcloud.com/application/stable
electronUpdaterCompatibility: ">=2.16"
npmRebuild: false
