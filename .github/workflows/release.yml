name: Release

# tag 推送时一次性产出内嵌控制面界面的 lework 二进制与 Android APK（另附 zip 供 COS 分发），
# 再统一挂到同一个 GitHub Release。桌面端仍由 desktop-release.yml 负责，
# 后续合并进本工作流时把它的 build job 加进来即可。
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.2"

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # 手动触发时没有 tag，用最近的 tag 加提交号，仅用于产出可识别的构建产物。
            version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
            version="${version:-0.0.0}-dev.${GITHUB_SHA:0:7}"
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号必须是 vX.Y.Z 或 vX.Y.Z-suffix，实际收到：${version}"
            exit 1
          fi

          major="$(printf '%s' "$version" | cut -d. -f1)"
          minor="$(printf '%s' "$version" | cut -d. -f2)"
          patch="$(printf '%s' "$version" | cut -d. -f3 | sed 's/[^0-9].*//')"
          # Android 的 versionCode 单调递增，按 X*10000+Y*100+Z 映射，0.7.1 -> 701。
          code=$((major * 10000 + minor * 100 + patch))

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "android_version_code=${code}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version} (Android versionCode ${code})"

  frontend:
    name: Build control plane UI
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build control plane UI
        run: pnpm --filter @lework/control-plane build

      - name: Verify static export
        shell: bash
        run: |
          set -euo pipefail
          out="apps/control-plane/out"
          if [ ! -f "${out}/index.html" ]; then
            echo "::error::控制面静态导出缺少 ${out}/index.html"
            exit 1
          fi

      # 控制面界面由 lework 二进制内嵌并提供，不单独发包；后端 job 通过该
      # artifact 把它拷进 backend/internal/controlplane/webui/dist，避免重复构建。
      - name: Upload embedded UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-ui
          path: frontend/apps/control-plane/out
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs:
      - prepare
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download control plane UI
        uses: actions/download-artifact@v4
        with:
          name: control-plane-ui
          path: backend/internal/controlplane/webui/dist

      - name: Build binary
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi

          mkdir -p "${RUNNER_TEMP}/build"
          out="${RUNNER_TEMP}/build/lework${ext}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "$out" ./backend/cmd/lework/

          # linux/amd64 与 runner 同平台，可以真的执行一次确认版本注入生效。
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "amd64" ]; then
            actual="$("$out" --version)"
            echo "$actual"
            if [ "$actual" != "lework ${VERSION}" ]; then
              echo "::error::版本注入失败，期望 lework ${VERSION}，实际 ${actual}"
              exit 1
            fi
          fi

      - name: Package archive
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          name="lework-${GOOS}_${GOARCH}-${VERSION}"
          mkdir -p "${RUNNER_TEMP}/package"

          if [ "$GOOS" = "windows" ]; then
            (
              cd "${RUNNER_TEMP}/build"
              zip -q "${RUNNER_TEMP}/package/${name}.zip" lework.exe
            )
          else
            tar -C "${RUNNER_TEMP}/build" -czf "${RUNNER_TEMP}/package/${name}.tar.gz" lework
          fi

      - name: Upload backend release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-backend-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/package/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Set app version from tag
        working-directory: frontend/apps/mobile
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_version_code }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "app.json";
            const app = JSON.parse(fs.readFileSync(path, "utf8"));
            app.expo.version = process.env.APP_VERSION;
            app.expo.android = {
              ...app.expo.android,
              versionCode: Number(process.env.ANDROID_VERSION_CODE),
            };
            fs.writeFileSync(path, `${JSON.stringify(app, null, "\t")}\n`);
            console.log(`app.json version=${app.expo.version} versionCode=${app.expo.android.versionCode}`);
          '

      - name: Typecheck and test mobile app
        run: |
          pnpm --filter @lework/mobile typecheck
          pnpm --filter @lework/mobile test

      - name: Prebuild Android project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: pnpm --filter @lework/mobile exec expo prebuild --platform android --no-install

      - name: Bump Gradle memory
        working-directory: frontend/apps/mobile/android
        run: |
          # RN release 构建在 2g 堆上容易 OOM，runner 有 16g 可用。
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties

      - name: Build release APK
        working-directory: frontend/apps/mobile/android
        env:
          CI: "1"
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # tag 构建无法复用 main 的 Gradle 缓存（见 setup-gradle 的分支作用域），
          # 插件仓库偶发不可用会直接卡在配置阶段；重试时刷新依赖，避免 Gradle 复用失败结果。
          for attempt in 1 2 3; do
            extra=()
            if [ "$attempt" -gt 1 ]; then
              extra=(--refresh-dependencies)
            fi
            if ./gradlew assembleRelease --no-daemon --stacktrace "${extra[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Gradle 构建失败（第 ${attempt} 次），30 秒后重试"
              sleep 30
            fi
          done
          exit 1

      - name: Verify APK signature
        working-directory: frontend/apps/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::未找到 release APK：${apk}"
            exit 1
          fi

          apksigner=""
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}/build-tools" ]; then
            apksigner="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          fi
          if [ -n "$apksigner" ]; then
            # 目前用 prebuild 模板自带的 debug.keystore 签名，仅供内部分发安装。
            "$apksigner" verify --print-certs "$apk"
          else
            echo "未找到 apksigner，跳过签名校验"
          fi

          du -h "$apk"

      - name: Collect Android packages
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          package_dir="${RUNNER_TEMP}/package"
          apk_name="lework-android-${VERSION}.apk"
          mkdir -p "$package_dir"
          cp "$apk" "${package_dir}/${apk_name}"

          # COS 不允许匿名下载 apk，额外压一份同名 zip 给客户端下载；GitHub Release
          # 仍保留原始 apk，方便手动安装。
          (
            cd "$package_dir"
            zip -q "lework-android-${VERSION}.zip" "$apk_name"
            unzip -l "lework-android-${VERSION}.zip"
          )

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ${{ runner.temp }}/package/*
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Build desktop ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS runner 排队时间过长，暂时停用；恢复时取消下面两段注释即可。
          # - name: mac-arm64
          #   os: macos-15
          #   command: dist:desktop:mac:arm64
          # - name: mac-x64
          #   os: macos-15-intel
          #   command: dist:desktop:mac:x64
          - name: win-x64
            os: windows-latest
            command: dist:desktop:win:x64
          - name: linux-x64
            os: ubuntu-latest
            command: dist:desktop:linux:x64
    env:
      VITE_LEWORK_API_BASE_URL: ${{ vars.VITE_LEWORK_API_BASE_URL || 'https://applework.insmtx.com/v1' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: desktop-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            desktop-electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi

            status=$?
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi

            echo "pnpm install failed, retrying in $((attempt * 20)) seconds..."
            sleep $((attempt * 20))
          done
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          electron_config_cache: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

      - name: Set desktop version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: frontend/apps/desktop
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            const packagePath = "package.json";
            const packageJson = JSON.parse(fs.readFileSync(packagePath, "utf8"));
            packageJson.version = version;
            fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          ' "$version"
          echo "Desktop version: $version"

      - name: Typecheck desktop app
        working-directory: frontend
        run: pnpm --filter @lework/desktop typecheck

      - name: Prepare macOS signing credentials
        if: startsWith(matrix.name, 'mac-')
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          for variable in APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER CSC_LINK CSC_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Required macOS signing secret is missing: ${variable}"
              exit 1
            fi
          done

          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build desktop package
        working-directory: frontend
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm run "${{ matrix.command }}"; then
              exit 0
            fi

            status=$?
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi

            echo "Desktop package build failed, retrying in $((attempt * 30)) seconds..."
            sleep $((attempt * 30))
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          electron_config_cache: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          CSC_LINK: ${{ startsWith(matrix.name, 'mac-') && secrets.MACOS_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(matrix.name, 'mac-') && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ startsWith(matrix.name, 'mac-') && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(matrix.name, 'mac-') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.name, 'mac-') && secrets.APPLE_API_ISSUER || '' }}

      # 公证或签名材料有问题时不阻断整个发布：产物仍然上传，正式分发前需要人工确认。
      - name: Verify macOS signature and notarization
        if: startsWith(matrix.name, 'mac-')
        continue-on-error: true
        working-directory: frontend/apps/desktop
        shell: bash
        run: |
          dmg_path="$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "::error::No DMG package found"
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          app_path="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "::error::No application bundle found in DMG"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Collect desktop payload
        shell: bash
        run: |
          release_dir="${RUNNER_TEMP}/desktop-release/${{ matrix.name }}"
          mkdir -p "$release_dir"

          case "${{ matrix.name }}" in
            mac-*)
              cp frontend/apps/desktop/dist/*.dmg "$release_dir"/
              cp frontend/apps/desktop/dist/*.zip "$release_dir"/
              cp frontend/apps/desktop/dist/*.blockmap "$release_dir"/
              cp frontend/apps/desktop/dist/latest-mac.yml "$release_dir"/
              ;;
            win-*)
              cp frontend/apps/desktop/dist/*.exe "$release_dir"/
              cp frontend/apps/desktop/dist/*.blockmap "$release_dir"/
              cp frontend/apps/desktop/dist/latest.yml "$release_dir"/
              ;;
            linux-*)
              cp frontend/apps/desktop/dist/*.AppImage "$release_dir"/
              cp frontend/apps/desktop/dist/*.deb "$release_dir"/
              cp frontend/apps/desktop/dist/latest-linux.yml "$release_dir"/
              ;;
            *)
              echo "::error::Unsupported build matrix target: ${{ matrix.name }}"
              exit 1
              ;;
          esac

      - name: Upload desktop release artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update-files-${{ matrix.name }}
          path: ${{ runner.temp }}/desktop-release/${{ matrix.name }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs:
      - prepare
      - backend
      - android
      - desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-update-files-*
          path: desktop-assets

      - name: Collect assets and checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p upload
          find release-assets -type f -exec cp {} upload/ \;
          find desktop-assets -type f -exec cp {} upload/ \;

          if [ -z "$(ls -A upload)" ]; then
            echo "::error::没有可发布的产物"
            exit 1
          fi

          cd upload
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS-release.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS-release.txt
          cat SHA256SUMS-release.txt

      # 客户端从 COS 发现新版本，所以先写 COS 再创建 GitHub Release，避免指针
      # 指向一个还没传完的版本。
      - name: Stage COS layout
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p cos-upload/server cos-upload/android
          # 后端包名 lework-<os>_<arch>-<version>.<ext>；Windows 用 zip，其余 tar.gz。
          cp upload/lework-*.tar.gz cos-upload/server/
          cp upload/lework-windows_*.zip cos-upload/server/
          # COS 不允许下载 apk，只上传 zip；原始 apk 仍留在 GitHub Release。
          cp upload/lework-android-*.zip cos-upload/android/

          # 桌面端各平台/架构的 latest*.yml 同名，必须分目录存放。
          for dir in desktop-assets/desktop-update-files-*; do
            [ -d "$dir" ] || continue
            name="${dir##*/desktop-update-files-}"
            case "$name" in
              mac-arm64) target="darwin/arm64" ;;
              mac-x64) target="darwin/x64" ;;
              win-x64) target="win32/x64" ;;
              linux-x64) target="linux/x64" ;;
              *) echo "::error::未知桌面目标：${name}"; exit 1 ;;
            esac
            mkdir -p "cos-upload/${target}"
            cp "$dir"/* "cos-upload/${target}/"
          done

          if [ -z "$(ls -A cos-upload/server)" ] || [ -z "$(ls -A cos-upload/android)" ]; then
            echo "::error::COS 布局缺少 server 或 android 产物"
            exit 1
          fi

          # 根目录安装包兼容旧下载页；Linux deb 额外补 amd64 别名。
          mkdir -p cos-root
          find cos-upload -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' \) -exec cp {} cos-root/ \;
          for deb in cos-root/*-linux-x64.deb; do
            [ -e "$deb" ] || continue
            cp "$deb" "${deb%-linux-x64.deb}-linux-amd64.deb"
          done

          ( cd cos-upload && find . -type f ! -name 'SHA256SUMS.txt' -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find cos-upload cos-root -type f | sort

      - name: Setup coscmd
        shell: bash
        run: |
          # 用 venv 安装，避免 runner 的 PEP 668 externally-managed 限制。
          python3 -m venv "${RUNNER_TEMP}/coscmd-venv"
          "${RUNNER_TEMP}/coscmd-venv/bin/pip" install --quiet coscmd
          echo "${RUNNER_TEMP}/coscmd-venv/bin" >> "$GITHUB_PATH"

      # LATEST.txt 是唯一指针：稳定 tag 且版本更大时 publish-cos.sh 才会推进。
      - name: Upload to COS
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET || 'leros-1395325824' }}
          COS_REGION: ${{ vars.COS_REGION || 'ap-beijing' }}
          # 海外 runner 直连 ap-beijing 常超时，默认走 COS 全球加速（需 bucket 已开启）。
          COS_ENDPOINT: ${{ vars.COS_ENDPOINT || 'cos.accelerate.myqcloud.com' }}
          COS_RETRY: "5"
          COS_TIMEOUT: "120"
          RELEASE_PREFIX: application
          UPDATE_LATEST_FILE: "1"
          ROOT_INSTALLER_DIR: cos-root
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${COS_SECRET_ID}" ] || [ -z "${COS_SECRET_KEY}" ]; then
            echo "::error::缺少 COS_SECRET_ID / COS_SECRET_KEY，请在仓库或组织 secrets 中配置"
            exit 1
          fi
          bash scripts/release/publish-cos.sh cos-upload "${VERSION}"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 用 GH_REPO 明确发版仓库，避免 checkout 的凭据策略影响 gh 的仓库推断。
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          echo "repo=${GH_REPO} tag=${tag}"
          prerelease=()
          case "$tag" in
            *-*) prerelease+=(--prerelease) ;;
          esac

          # 同一个 Release 可能已被重跑或旧流水线创建，存在就改为追加。
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" >/dev/null 2>&1; then
              if gh release upload "$tag" upload/* --clobber; then
                echo "已把产物追加到现有 Release ${tag}"
                exit 0
              fi
            else
              if gh release create "$tag" upload/* \
                --title "$tag" \
                --generate-notes \
                "${prerelease[@]}"; then
                echo "已创建 Release ${tag}"
                exit 0
              fi
            fi

            echo "第 ${attempt} 次发布失败，$((attempt * 10)) 秒后重试"
            sleep $((attempt * 10))
          done

          # 最后再直接跑一次，让 gh 的具体报错进日志，便于排查。
          gh release view "$tag" || true
          echo "::error::发布 ${tag} 失败"
          exit 1
