      - Storage
    put:
      consumes:
      - application/octet-stream
      description: 消费预签名上传 URL，验证 token 后保存文件内容到指定 bucket/key
      parameters:
      - description: 存储桶名称
        in: path
        name: bucket
        required: true
        type: string
      - description: 对象 key
        in: path
        name: key
        required: true
        type: string
      - description: 预签名 token
        in: query
        name: token
        required: true
        type: string
      - description: 过期时间戳(秒)
        in: query
        name: expires
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: 预签名验证失败
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 上传失败
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 预签名上传
      tags:
      - Storage
  /projects/{project_id}/files:
    get:
      description: |-
        获取项目 artifacts/ 和 uploads/ 目录的文件树，可通过 resource_type 参数筛选。
        文件节点包含 created_at 字段（Unix 秒级时间戳），表示该文件关联记录创建的时间，未找到时为 0。
      parameters:
      - description: 项目 public_id
        in: path
        name: project_id
        required: true
        type: string
      - description: 资源类型：user_upload | artifact | plan；默认排除 plan
        in: query
        name: resource_type
        type: string
      - description: Task public ID，传入时仅返回该任务的产物文件
        in: query
        name: task_id
        type: string
      - description: 节点类型：folder | file；默认返回文件与文件夹
        in: query
        name: node_type
        type: string
      - description: 文件类型分组：pdf | docx | xlsx | pptx | md | image | text
        in: query
        name: file_ext
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 获取项目文件树
      tags:
      - Project
  /projects/{project_id}/files/{filepath}:
    get:
      description: 通过文件路径下载项目仓库中的文件
      parameters:
      - description: 项目 public_id
        in: path
        name: project_id
        required: true
        type: string
      - description: 文件相对路径，如 /src/main.go
        in: path
        name: filepath
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: 文件内容
          schema:
            type: file
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 下载项目文件
      tags:
      - Project
  /projects/{project_id}/memory:
    get:
      description: 根据 project_id 获取项目的持久记忆条目
