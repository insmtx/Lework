host: localhost:8080
info:
  contact: {}
  description: Leros 数字助手平台 API，提供数字助手管理、技能调用、事件处理等功能
  title: Leros API
  version: "1.0"
paths:
  /AddMessage:
    post:
      consumes:
      - application/json
      description: 向指定会话添加一条消息
      parameters:
      - description: 添加消息请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AddMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 添加会话消息
      tags:
      - Session
  /AuthSession:
    get:
      description: 获取当前用户、当前组织和可切换组织列表
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: 认证失败
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 当前登录会话
      tags:
      - Auth
  /BatchCheckPermission:
    post:
      consumes:
      - application/json
      description: 批量检查当前用户对多个资源/动作的权限（用于前端控制按钮可见性）
      parameters:
      - description: 批量权限检查请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.batchCheckPermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 批量检查权限
      tags:
      - Permission
  /ChooseUin:
    post:
      consumes:
      - application/json
      description: 使用 refresh token 选择组织并获取访问令牌
      parameters:
      - description: 选择组织请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/contract.ChooseUinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 认证失败
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
